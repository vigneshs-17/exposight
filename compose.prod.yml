# Log rotation for every service (Phase E): Docker's json-file driver keeps at most
# 3 files of 10 MB per container. Caddy access logs stay off by decision (docs/DEPLOY.md).
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  db:
    logging: *default-logging
    image: postgres:18.6-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      # Least-privilege roles, created once on a fresh volume by deploy/postgres-init.
      OWNER_DB_USER: ${OWNER_DB_USER:-exposight_owner}
      OWNER_DB_PASSWORD: ${OWNER_DB_PASSWORD}
      APP_DB_USER: ${APP_DB_USER:-exposight_app}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 5
    volumes:
      # Official postgres 18 image volume path is /var/lib/postgresql (PGDATA=/var/lib/postgresql/18/docker)
      - pgdata:/var/lib/postgresql
      - ./deploy/postgres-init:/docker-entrypoint-initdb.d:ro
    networks:
      app-tier:
        # Fixed address: the worker egress firewall allows Postgres to this IP only
        # (must equal egress EGRESS_DB_IP; tests/test_deploy_config.py checks it).
        ipv4_address: 10.89.0.10
    # Port 5432 is strictly internal to app-tier; no host port publishing.

  migrate:
    logging: *default-logging
    build:
      context: .
      dockerfile: Dockerfile
    entrypoint: ["alembic"]
    command: ["upgrade", "head"]
    restart: "no"
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-production}
      # Migrations run as the owner role; api and worker use the app role (DATABASE_URL).
      DATABASE_URL: ${MIGRATION_DATABASE_URL}
      APP_DB_USER: ${APP_DB_USER:-exposight_app}
    depends_on:
      db:
        condition: service_healthy
    networks:
      app-tier:

  api:
    logging: *default-logging
    build:
      context: .
      dockerfile: Dockerfile
    entrypoint: ["uvicorn"]
    # Single worker (--workers 1): rate limits are kept in memory (src/asm/ratelimit.py).
    # Multiple worker processes would each keep their own in-memory counters.
    # --proxy-headers and --forwarded-allow-ips restrict trusted upstream proxy headers strictly
    # to the fixed app-tier subnet (10.89.0.0/24), preventing client IP header spoofing.
    command:
      - "asm.api.main:app"
      - "--host"
      - "0.0.0.0"
      - "--port"
      - "8000"
      - "--workers"
      - "1"
      - "--proxy-headers"
      - "--forwarded-allow-ips=10.89.0.0/24"
    restart: unless-stopped
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-production}
      DATABASE_URL: ${DATABASE_URL}
      SUPABASE_URL: ${SUPABASE_URL:-}
      SUPABASE_PUBLISHABLE_KEY: ${SUPABASE_PUBLISHABLE_KEY:-}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-authenticated}
    healthcheck:
      test:
        - "CMD"
        - "python"
        - "-c"
        - "import urllib.request, sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health').status == 200 else 1)"
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s
    depends_on:
      migrate:
        condition: service_completed_successfully
    networks:
      app-tier:
    # Port 8000 is internal only; reverse-proxied exclusively by Caddy.

  egress:
    logging: *default-logging
    # Worker egress firewall (Phase D-2, docs/DEPLOY.md). Owns the network namespace
    # the worker joins; applies deploy/egress/rules.sh, then idles. Only this container
    # has NET_ADMIN. If the rules fail it exits and the worker never starts.
    build:
      context: ./deploy/egress
    restart: unless-stopped
    cap_drop: ["ALL"]
    cap_add: ["NET_ADMIN", "NET_RAW"]
    environment:
      EGRESS_DB_IP: 10.89.0.10
    # Public resolvers (D14): Oracle's VCN resolver is 169.254.169.254, which the rules block.
    dns:
      - 1.1.1.1
      - 9.9.9.9
    healthcheck:
      test:
        - "CMD-SHELL"
        - "test -f /run/egress-ready && iptables -C OUTPUT -d 169.254.0.0/16 -j REJECT --reject-with icmp-admin-prohibited"
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 5s
    networks:
      app-tier:
    # Publishes no ports.

  worker:
    logging: *default-logging
    build:
      context: .
      dockerfile: Dockerfile
    entrypoint: ["python", "-m", "asm.worker"]
    restart: unless-stopped
    stop_grace_period: 60s
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-production}
      DATABASE_URL: ${DATABASE_URL}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_FROM: ${SMTP_FROM:-alerts@exposight.dev}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_STARTTLS: ${SMTP_STARTTLS:-true}
      SMTP_SSL: ${SMTP_SSL:-false}
      SMTP_TIMEOUT: ${SMTP_TIMEOUT:-10}
      # Discovery (crt.sh with Cert Spotter fallback) runs in the worker
      CERTSPOTTER_API_KEY: ${CERTSPOTTER_API_KEY:-}
      # Retention purge (D9): off unless set to true after a dry run (docs/DEPLOY.md)
      RETENTION_PURGE_ENABLED: ${RETENTION_PURGE_ENABLED:-false}
    depends_on:
      migrate:
        condition: service_completed_successfully
      egress:
        condition: service_healthy
        # A restarted egress container is a new network namespace: restart the worker too.
        restart: true
    # All worker traffic leaves through the egress container's firewalled namespace.
    # No networks: here and no NET_ADMIN, so the worker cannot change the rules.
    network_mode: "service:egress"
    # Worker is a background task processor; publishes no ports.

  caddy:
    logging: *default-logging
    image: caddy:2.11.4-alpine
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN:-exposight.dev}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      api:
        condition: service_healthy
    networks:
      app-tier:

networks:
  app-tier:
    ipam:
      driver: default
      config:
        - subnet: 10.89.0.0/24
          # Dynamic addresses come from the upper half, so the db's static 10.89.0.10
          # can never be handed to another container first.
          ip_range: 10.89.0.128/25

volumes:
  pgdata:
  caddy_data:
  caddy_config:
