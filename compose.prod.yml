services:
  db:
    image: postgres:18.6-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 5
    volumes:
      # Official postgres 18 image volume path is /var/lib/postgresql (PGDATA=/var/lib/postgresql/18/docker)
      - pgdata:/var/lib/postgresql
    networks:
      app-tier:
    # Port 5432 is strictly internal to app-tier; no host port publishing.

  migrate:
    build:
      context: .
      dockerfile: Dockerfile
    entrypoint: ["alembic"]
    command: ["upgrade", "head"]
    restart: "no"
    environment:
      DATABASE_URL: ${DATABASE_URL}
    depends_on:
      db:
        condition: service_healthy
    networks:
      app-tier:

  api:
    build:
      context: .
      dockerfile: Dockerfile
    entrypoint: ["uvicorn"]
    # Single worker (--workers 1) because phase v3.6b implements in-memory IP rate limiting
    # across requests. Multiple worker processes would partition in-memory buckets.
    # --proxy-headers and --forwarded-allow-ips restrict trusted upstream proxy headers strictly
    # to the fixed app-tier subnet (10.89.0.0/24), preventing client IP header spoofing.
    command:
      - "asm.api.main:app"
      - "--host"
      - "0.0.0.0"
      - "--port"
      - "8000"
      - "--workers"
      - "1"
      - "--proxy-headers"
      - "--forwarded-allow-ips=10.89.0.0/24"
    restart: unless-stopped
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-production}
      DATABASE_URL: ${DATABASE_URL}
      SUPABASE_URL: ${SUPABASE_URL:-}
      SUPABASE_PUBLISHABLE_KEY: ${SUPABASE_PUBLISHABLE_KEY:-}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-authenticated}
    healthcheck:
      test:
        - "CMD"
        - "python"
        - "-c"
        - "import urllib.request, sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health').status == 200 else 1)"
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s
    depends_on:
      migrate:
        condition: service_completed_successfully
    networks:
      app-tier:
    # Port 8000 is internal only; reverse-proxied exclusively by Caddy.

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    entrypoint: ["python", "-m", "asm.worker"]
    restart: unless-stopped
    stop_grace_period: 60s
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-production}
      DATABASE_URL: ${DATABASE_URL}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_FROM: ${SMTP_FROM:-alerts@exposight.dev}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_STARTTLS: ${SMTP_STARTTLS:-true}
      SMTP_TIMEOUT: ${SMTP_TIMEOUT:-10}
      # Discovery (crt.sh with Cert Spotter fallback) runs in the worker
      CERTSPOTTER_API_KEY: ${CERTSPOTTER_API_KEY:-}
    depends_on:
      migrate:
        condition: service_completed_successfully
    networks:
      app-tier:
    # Worker is a background task processor; publishes no ports.

  caddy:
    image: caddy:2.11.4-alpine
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN:-exposight.dev}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      api:
        condition: service_healthy
    networks:
      app-tier:

networks:
  app-tier:
    ipam:
      driver: default
      config:
        - subnet: 10.89.0.0/24

volumes:
  pgdata:
  caddy_data:
  caddy_config:
