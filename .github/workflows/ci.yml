name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least privilege for GITHUB_TOKEN: jobs only need to read the repository.
permissions:
  contents: read

jobs:
  test:
    name: Lint & Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run linter (ruff)
        run: |
          ruff check .

      - name: Run unit test suite (pytest)
        run: |
          pytest

  docker:
    name: Docker Build & Smoke Test
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Build Docker image
        run: |
          docker build -t exposight .

      - name: Run CLI smoke test
        run: |
          docker run --rm exposight --help

      - name: Verify non-root user
        run: |
          test "$(docker run --rm --entrypoint whoami exposight)" = "asm"

      - name: Verify worker entry point import
        run: |
          docker run --rm --entrypoint python exposight -c "from asm.worker.__main__ import main"

  docker-arm64:
    name: Docker ARM64 Build (QEMU)
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build ARM64 Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          push: false


  db-test:
    name: Database Migrations & API Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.6-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: asm_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d asm_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run database migrations & verification
        env:
          DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/asm_test
          TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/asm_test
        run: |
          alembic upgrade head
          alembic check
          alembic downgrade -1
          alembic upgrade head

      # Phase G (D24): the full non-browser suite (a superset of `-m db`) with coverage.
      # fail_under = 90 in pyproject.toml, the floor of the measured 90.48% line+branch.
      - name: Run full test suite with database and coverage gate
        env:
          DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/asm_test
          TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/asm_test
        run: |
          pytest --cov --cov-report=term --cov-report=xml --cov-report=html

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: |
            coverage.xml
            htmlcov/
          if-no-files-found: ignore

  browser-test:
    name: Playwright Browser Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.6-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: asm_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d asm_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Install Playwright browsers and system dependencies
        run: |
          playwright install --with-deps chromium

      - name: Build the test database schema with Alembic
        env:
          DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/asm_test
        run: |
          alembic upgrade head

      - name: Run browser tests
        env:
          DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/asm_test
          TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/asm_test
        run: |
          pytest -m browser -v

      - name: Upload Playwright failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-artifacts
          path: output/playwright/
          if-no-files-found: ignore




  egress-firewall:
    name: Worker Egress Firewall (compose.prod.yml)
    needs: test
    runs-on: ubuntu-latest
    env:
      COMPOSE: docker compose -p exposight-ci -f compose.prod.yml --env-file ci.env

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Write a throwaway production env file
        run: |
          p1=$(openssl rand -hex 16); p2=$(openssl rand -hex 16); p3=$(openssl rand -hex 16)
          cat > ci.env <<ENV
          ENVIRONMENT=production
          DOMAIN=exposight.invalid
          POSTGRES_USER=postgres
          POSTGRES_PASSWORD=$p1
          POSTGRES_DB=exposight
          OWNER_DB_USER=exposight_owner
          OWNER_DB_PASSWORD=$p2
          MIGRATION_DATABASE_URL=postgresql+psycopg://exposight_owner:$p2@db:5432/exposight
          APP_DB_USER=exposight_app
          APP_DB_PASSWORD=$p3
          DATABASE_URL=postgresql+psycopg://exposight_app:$p3@db:5432/exposight
          SUPABASE_URL=https://egresscheck.supabase.co
          SUPABASE_PUBLISHABLE_KEY=egress-check-publishable-key
          SMTP_HOST=
          ENV

      - name: Start db, api, egress and worker (no Caddy)
        run: |
          $COMPOSE up -d --build db migrate api egress worker
          sleep 5
          $COMPOSE ps

      - name: Egress check from inside the worker
        run: |
          $COMPOSE exec -T worker python - < scripts/egress_check.py

      - name: Negative control - the same check without the firewall must fail
        run: |
          if docker run --rm -i --network exposight-ci_app-tier --entrypoint python \
              exposight-ci-worker - < scripts/egress_check.py; then
            echo "egress_check.py passed without the firewall: the check proves nothing"; exit 1
          fi

      - name: Show logs on failure
        if: failure()
        run: |
          $COMPOSE ps -a
          $COMPOSE logs egress worker api migrate

      - name: Tear down
        if: always()
        run: |
          $COMPOSE down -v
