name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least privilege for GITHUB_TOKEN: jobs only need to read the repository.
permissions:
  contents: read

jobs:
  test:
    name: Lint & Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run linter (ruff)
        run: |
          ruff check .

      - name: Run unit test suite (pytest)
        run: |
          pytest

  docker:
    name: Docker Build & Smoke Test
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Build Docker image
        run: |
          docker build -t asm-saas .

      - name: Run CLI smoke test
        run: |
          docker run --rm asm-saas --help

      - name: Verify non-root user
        run: |
          test "$(docker run --rm --entrypoint whoami asm-saas)" = "asm"

      - name: Verify worker entry point import
        run: |
          docker run --rm --entrypoint python asm-saas -c "from asm.worker.__main__ import main"

  docker-arm64:
    name: Docker ARM64 Build (QEMU)
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build ARM64 Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          push: false


  db-test:
    name: Database Migrations & API Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.6-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: asm_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d asm_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run database migrations & verification
        env:
          DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/asm_test
          TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/asm_test
        run: |
          alembic upgrade head
          alembic check
          alembic downgrade -1
          alembic upgrade head

      - name: Run database integration tests
        env:
          DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/asm_test
          TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/asm_test
        run: |
          pytest -m db

  browser-test:
    name: Playwright Browser Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.6-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: asm_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d asm_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Install Playwright browsers and system dependencies
        run: |
          playwright install --with-deps chromium

      - name: Run browser tests
        env:
          DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/asm_test
          TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/asm_test
        run: |
          pytest -m browser -v

      - name: Upload Playwright failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-artifacts
          path: output/playwright/
          if-no-files-found: ignore



