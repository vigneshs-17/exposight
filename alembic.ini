# Alembic configuration for Exposight
# NOTE: No database URL is stored in this file. migrations/env.py dynamically
# reads DATABASE_URL from asm.config.get_settings().

[alembic]
script_location = migrations
file_template = %%(rev)s_%%(slug)s
timezone = UTC
truncate_slug_length = 40
prepend_sys_path = src
path_separator = os

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
