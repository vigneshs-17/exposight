[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "asm-saas"
version = "0.1.0"
description = "Exposight - attack surface management: passive discovery and recon"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Student Researcher" }
]
dependencies = [
    "httpx>=0.27.0",
    "dnspython>=2.6.0",
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "sqlalchemy>=2.0.0",
    "psycopg[binary]>=3.2.0",
    "alembic>=1.13.0",
    "pydantic-settings>=2.4.0",
    "email-validator>=2.0.0",
    "pyjwt[crypto]>=2.9.0",
    "cryptography>=42.0.0",
    "jinja2>=3.1.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.5.0",
    "playwright>=1.49.0",
    "pyyaml>=6.0.0",
]

[project.scripts]
asm = "asm.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"asm" = [
    "templates/*.html",
    "templates/**/*.html",
    "static/**/*",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
]
ignore = []

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --strict-markers -m 'not integration and not browser'"
# Our code must not use deprecated Starlette status names (e.g. HTTP_422_UNPROCESSABLE_ENTITY).
filterwarnings = ["error:'HTTP_\\w+' is deprecated:Warning"]
markers = [
    "integration: real network integration tests (deselected by default in CI)",
    "db: tests requiring a real PostgreSQL database (run when TEST_DATABASE_URL is set)",
    "browser: Playwright browser tests requiring a running server and chromium (deselected by default)",
]
