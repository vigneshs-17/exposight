<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <title>{{ title }} - Exposight</title>
  <link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/static/css/app.css">
</head>
<body>
<header class="app-header">
  <a href="/" class="brand-title" aria-label="Exposight home">
    <svg class="brand-mark" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="5.5"/><circle cx="12" cy="12" r="1.6"/></svg>
    <span>Exposight</span>
  </a>
</header>

<main class="app-main error-main">
  <section class="surface-panel" aria-labelledby="error-title">
    <p class="error-code">Error {{ status_code }}</p>
    <h1 id="error-title" class="panel-title">{{ title }}</h1>
    <p class="panel-subtitle">{{ message }}</p>
    <div class="action-row">
      <a href="/" class="btn btn-secondary">Home</a>
      <a href="/app" class="btn btn-primary">Open dashboard</a>
    </div>
  </section>
</main>
</body>
</html>
