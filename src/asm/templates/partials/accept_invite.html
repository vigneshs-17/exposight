<div class="surface-panel-header" id="accept-invite-panel">
  <form id="accept-invite-form" class="form-inline">
    <div class="form-group">
      <label for="invite-token" class="form-label">Have an invite? Paste the invite token</label>
      <input type="text" id="invite-token" name="token" class="form-input" autocomplete="off" spellcheck="false" required maxlength="128">
    </div>
    <button type="submit" class="btn btn-secondary">Join organization</button>
  </form>
</div>
