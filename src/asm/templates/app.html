{% extends "base.html" %}

{% block title %}Dashboard - Exposight{% endblock %}

{% block body %}
<header class="app-header">
  <a href="/app" class="brand-title">
    <span class="brand-badge">EXP</span>
    <span>Exposight</span>
  </a>
  <div id="app-shell" class="header-controls hidden">
    <label for="org-switcher-select" class="form-label hidden">Select organization</label>
    <select id="org-switcher-select" class="form-select" aria-label="Select organization"></select>
    <span id="user-email-display" class="text-muted"></span>
    <button type="button" id="signout-button" class="btn btn-secondary btn-sm">Sign out</button>
  </div>
</header>

<main class="app-main">
  <div id="global-error-box" class="alert-box alert-error hidden" role="alert"></div>

  <!-- Sign In Container (Shown when unauthenticated) -->
  <section id="auth-section" class="surface-panel">
    <div class="surface-panel-header">
      <h1 class="panel-title">Sign in to Exposight</h1>
      <p class="panel-subtitle">Access your organization's attack surface inventory.</p>
    </div>
    <form id="signin-form">
      <div class="form-group">
        <label for="signin-email" class="form-label">Email address</label>
        <input type="email" id="signin-email" name="email" class="form-input" required autocomplete="email">
      </div>
      <div class="form-group">
        <label for="signin-password" class="form-label">Password</label>
        <input type="password" id="signin-password" name="password" class="form-input" required autocomplete="current-password">
      </div>
      <button type="submit" class="btn btn-primary">Sign in</button>
    </form>
  </section>

  <!-- Dynamic Content Target Area (Populated by HTMX fragments) -->
  <section id="main-content-area"></section>
</main>
{% endblock %}
