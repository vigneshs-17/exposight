services:
  db:
    image: postgres:18.6-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 5
    volumes:
      # Official postgres 18 image volume path is /var/lib/postgresql (PGDATA=/var/lib/postgresql/18/docker)
      - postgres_data:/var/lib/postgresql
    # Do NOT publish database port to the host; internal compose network only

  migrate:
    build:
      context: .
      dockerfile: Dockerfile
    entrypoint: ["alembic"]
    command: ["upgrade", "head"]
    restart: "no"
    environment:
      DATABASE_URL: ${DATABASE_URL}
    depends_on:
      db:
        condition: service_healthy

  api:
    build:
      context: .
      dockerfile: Dockerfile
    entrypoint: ["uvicorn"]
    command: ["asm.api.main:app", "--host", "0.0.0.0", "--port", "8000"]
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL}
      SUPABASE_URL: ${SUPABASE_URL:-}
      SUPABASE_PUBLISHABLE_KEY: ${SUPABASE_PUBLISHABLE_KEY:-}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-authenticated}
    ports:
      # Bound strictly to 127.0.0.1 (not 0.0.0.0) because there is no authentication yet.
      - "127.0.0.1:8000:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    entrypoint: ["python", "-m", "asm.worker"]
    restart: unless-stopped
    stop_grace_period: 60s
    environment:
      DATABASE_URL: ${DATABASE_URL}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-1025}
      SMTP_FROM: ${SMTP_FROM:-alerts@asm.local}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_STARTTLS: ${SMTP_STARTTLS:-false}
      SMTP_TIMEOUT: ${SMTP_TIMEOUT:-10}
      CERTSPOTTER_API_KEY: ${CERTSPOTTER_API_KEY:-}
    depends_on:
      migrate:
        condition: service_completed_successfully

  mailpit:
    image: axllent/mailpit:v1.27.4
    profiles: ["dev"]
    restart: unless-stopped
    ports:
      # Bound strictly to 127.0.0.1 for local browser inspection
      - "127.0.0.1:8025:8025"
    # Port 1025 is not published to the host; reachable inside compose network only

volumes:
  postgres_data:
